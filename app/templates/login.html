{% extends "base.html" %}

{% block title %}Login - SocietySense{% endblock %}

{% block content %}

<h3>Login</h3>

<form method="post" action="/pages/login">
    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">Login</button>
</form>

{% if error %}
<p>{{ error }}</p>
{% endif %}

{% endblock %}
